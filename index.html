<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện tập CSS Selectors</title>
    <!-- Liên kết đến file style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tiêu đề h1 -->
    <h1 id="main-title">Trang web của tôi</h1>

    <!-- Đoạn văn mô tả bản thân -->
    <p class="bio">
        Xin chào! Tôi là một người đam mê công nghệ và đang trên hành trình học lập trình web để xây dựng các sản phẩm thực tế hữu ích.
    </p>

    <!-- Danh sách sở thích -->
    <ul class="hobby-list">
        <li>Lập trình và tìm hiểu công nghệ mới</li>
        <li>Chơi thể thao và rèn luyện sức khỏe</li>
        <li>Nghe nhạc và đọc sách thư giãn</li>
    </ul>

    <!-- Nút bấm -->
    <div class="action-container">
        <button id="cta-button" type="button">Nhấn vào đây</button>
    </div>

</body>
</html>
